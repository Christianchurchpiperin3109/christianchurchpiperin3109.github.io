<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personality Test</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <h1 class="bold-title">Personality <span class="title-accent">Test</span></h1>
          </div>
          <button id="randomize-btn" class="ghost-btn" type="button">Randomize</button>
        </div>

        <p id="instructions" class="instructions"></p>

        <div id="card-grid" class="card-grid"></div>

        <div id="setup-controls" class="controls">
          <button id="lock-answers" class="primary-btn" type="button">Lock in answers</button>
        </div>

        <div id="guess-controls" class="controls hidden">
          <button id="submit-guesses" class="primary-btn" type="button">Submit guesses</button>
        </div>

        <div id="result-controls" class="controls hidden">
          <p id="result-message" class="result-message"></p>
          <button id="play-again" class="ghost-btn" type="button">Play again</button>
        </div>
      </section>
    </main>

    <script src="script.js?v=3"></script>
  </body>
</html>
