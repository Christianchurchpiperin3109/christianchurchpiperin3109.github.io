<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <div id="yard" class="yard"></div>
    <div id="daycare-counter" class="daycare-counter">
      <img
        class="daycare-counter-ball"
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
        alt="Poké Ball"
      />
      <span id="daycare-count">0</span>
    </div>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Pokémon Day Care</p>
            <h1 class="bold-title">Timer</h1>
          </div>
        </div>

        <div class="timer-wrap">
          <div class="timer-image-slot">
            <img
              id="timer-egg"
              class="timer-egg"
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/egg.png"
              alt="Pokémon egg"
            />
            <img id="timer-pokemon" class="timer-pokemon hidden" src="" alt="Pokémon" />
          </div>
          <p id="timer-display" class="timer-display">00:00</p>
          <p id="timer-message" class="timer-message"></p>
        </div>

        <div class="presets">
          <button class="preset-btn" type="button" data-add-seconds="20">+20s</button>
          <button class="preset-btn" type="button" data-add-seconds="50">+50s</button>
        </div>

        <div class="custom-time">
          <label>
            Min
            <input id="minutes-input" type="number" min="0" max="59" value="0" />
          </label>
          <label>
            Sec
            <input id="seconds-input" type="number" min="0" max="59" value="0" />
          </label>
        </div>

        <div class="controls">
          <button id="start-btn" class="primary-btn" type="button">Start</button>
          <button id="pause-btn" class="ghost-btn" type="button">Pause</button>
          <button id="reset-btn" class="ghost-btn" type="button">Reset</button>
        </div>
      </section>
    </main>

    <script src="script.js?v=5"></script>
  </body>
</html>
